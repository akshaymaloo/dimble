name: Bug report
description: Something in Pliss misbehaves
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Pliss and macOS versions
      placeholder: "Pliss 0.3.2 · macOS 27.0 (25A000)"
    validations:
      required: true
  - type: dropdown
    id: displays
    attributes:
      label: Display setup
      options:
        - Built-in display only
        - External display(s)
        - Mixed, built-in plus external
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: "Pliss writes a log you can attach: `~/Library/Logs/Pliss/pliss.log` (`~/Library/Logs/Pelmet/pelmet.log` before 0.3.2). Paste the relevant part or drop the file here."
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or recording (optional)
