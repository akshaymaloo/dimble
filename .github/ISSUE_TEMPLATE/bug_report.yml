name: Bug report
description: Something in Dimble misbehaves
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Dimble and macOS versions
      placeholder: "Dimble 0.3.2 · macOS 27.0 (25A000)"
    validations:
      required: true
  - type: dropdown
    id: displays
    attributes:
      label: Display setup
      options:
        - Built-in display only
        - External display(s)
        - Mixed, built-in plus external
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: "In Finder, press ⇧⌘G, paste `~/Library/Logs/Dimble` and press Return, then drag `dimble.log` here. Before 0.3.2 it was `~/Library/Logs/Pelmet/pelmet.log`."
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or recording (optional)
